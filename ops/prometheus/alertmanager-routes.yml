# Task #2525 — Alertmanager route fragment for the Web Vitals alerts.
#
# Drop-in fragment to route the rules in `web-vitals-alerts.rules.yml`
# to the same Slack channel that receives the nightly load-test failure
# notification (`.github/workflows/load-test-nightly.yml`). That channel
# is wired through the `SLACK_WEBHOOK_URL` repo secret, which the
# `notify-slack-on-failure` composite action posts to.
#
# In an Alertmanager config, merge under `route.routes` and add the
# matching receiver to `receivers`. Example minimal config:
#
#   global:
