name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type checking
        run: npm run typecheck || npx tsc --noEmit

      # Task #1294 — run the jsdom-based estimate-component vitest suite on
      # every PR so regressions to the BidTabImportDialog suggestion-reason
      # popover surface (covered by
      # client/src/components/estimate/__tests__/BidTabImportDialog.popover-signals.test.tsx,
      # added in Task #1280) fail the PR check instead of slipping through.
      # SKIP_TEST_DB_PUSH=1 bypasses the server-suite globalSetup that would
      # otherwise require a live test database — these specs run entirely in
      # jsdom and do not touch the DB. Scoped to client/src/components/estimate
      # rather than the full client/ tree to avoid pulling in unrelated suites
      # with pre-existing failures outside this task's scope.
      - name: Run estimate frontend component tests
        env:
          SKIP_TEST_DB_PUSH: "1"
        run: npx vitest run client/src/components/estimate

      - name: Build application
        run: npm run build

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: development
      ENABLE_DEV_SEED: "true"
      PORT: "5000"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_test
      SESSION_SECRET: ci-session-secret-do-not-use-in-prod
      JWT_SECRET: ci-jwt-secret-do-not-use-in-prod
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Push database schema
        run: npm run db:push -- --force

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14

  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # TODO: Enable when ESLint is configured
      # - name: Run ESLint
      #   run: npm run lint

  security:
    name: Security Gate (SOC 2 CC8.1 / CC7.1)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Python (for semgrep & checkov)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install security scanners
        run: |
          python -m pip install --upgrade pip
          pip install semgrep checkov
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
          semgrep --version
          checkov --version

      - name: Run CI security gate
        id: security_gate
        run: |
          set +e
          mkdir -p security-reports
          bash scripts/ci-security.sh 2>&1 | tee security-reports/ci-security.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Publish job summary
        if: always()
        run: |
          {
            echo "# Security Gate Results"
            echo ""
            echo "SOC 2 controls: **CC8.1** (change management) and **CC7.1** (vulnerability management)."
            echo ""
            echo "Script: \`scripts/ci-security.sh\` — dependency audit, SAST (semgrep), secret scan (gitleaks), IaC scan (checkov), license audit (license-checker-rseidelsohn)."
            echo ""
            if [ "${{ steps.security_gate.outputs.exit_code }}" = "0" ]; then
              echo "**Status:** PASSED — no Critical/High findings."
            else
              echo "**Status:** FAILED (exit code ${{ steps.security_gate.outputs.exit_code }}) — merge is blocked until findings are remediated."
            fi
            echo ""
            echo "<details><summary>Full scanner output</summary>"
            echo ""
            echo '```'
            # Strip ANSI color codes for readability in the summary.
            sed 's/\x1b\[[0-9;]*m//g' security-reports/ci-security.log | tail -c 60000
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload security report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-security-report
          path: security-reports/
          retention-days: 90

      - name: Comment on PR with security gate result
        # Best-effort: forked PRs may not grant pull-requests:write, and we
        # don't want a comment-posting failure to mask the real gate result.
        # The job summary + uploaded artifact remain the canonical evidence.
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const exitCode = '${{ steps.security_gate.outputs.exit_code }}';
            const passed = exitCode === '0';
            let log = '';
            try {
              log = fs.readFileSync('security-reports/ci-security.log', 'utf8')
                // strip ANSI colors
                .replace(/\x1b\[[0-9;]*m/g, '');
            } catch (e) {
              log = '(no log captured)';
            }
            // Trim to last ~12k chars to stay under GitHub's 65k comment limit.
            const trimmed = log.length > 12000 ? '…(truncated)…\n' + log.slice(-12000) : log;
            const status = passed
              ? '✅ **PASSED** — no Critical/High findings.'
              : `❌ **FAILED** (exit code ${exitCode}) — merge is blocked until Critical/High findings are remediated.`;
            const marker = '<!-- ci-security-gate-comment -->';
            const body = [
              marker,
              '## Security Gate (SOC 2 CC8.1 / CC7.1)',
              '',
              status,
              '',
              'Script: `scripts/ci-security.sh` — dependency audit, SAST, secret scan, IaC scan, license audit.',
              '',
              '<details><summary>Scanner output</summary>',
              '',
              '```',
              trimmed,
              '```',
              '',
              '</details>',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }
