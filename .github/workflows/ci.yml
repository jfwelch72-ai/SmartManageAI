name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Task #2428 — Use the canonical `npm run check` script (= `tsc`) so the
      # PR gate exercises the same command developers run locally. The
      # tsconfig now includes `**/*.test.ts` (Task #2428), so test code is
      # typechecked alongside production code and can no longer drift.
      - name: Run TypeScript type checking
        run: npm run check

      # Task #1294 — run the jsdom-based estimate-component vitest suite on
      # every PR so regressions to the BidTabImportDialog suggestion-reason
      # popover surface (covered by
      # client/src/components/estimate/__tests__/BidTabImportDialog.popover-signals.test.tsx,
      # added in Task #1280) fail the PR check instead of slipping through.
      # SKIP_TEST_DB_PUSH=1 bypasses the server-suite globalSetup that would
      # otherwise require a live test database — these specs run entirely in
      # jsdom and do not touch the DB. Scoped to client/src/components/estimate
      # rather than the full client/ tree to avoid pulling in unrelated suites
      # with pre-existing failures outside this task's scope.
      - name: Run estimate frontend component tests
        env:
          SKIP_TEST_DB_PUSH: "1"
        run: npx vitest run client/src/components/estimate

      - name: Build application
        run: npm run build

      # Task #1909 — A typecheck / vitest / build regression on `main` would
      # otherwise sit silently in the Actions tab until somebody noticed. The
      # composite action handles the empty-secret fallback and run-link
      # formatting (see `.github/actions/notify-slack-on-failure/action.yml`).
      # No artifact is uploaded by this job, so `artifact-name` is omitted.
      - name: Notify Slack on build/test failure (main only)
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/notify-slack-on-failure
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          job-name: Build & Test

  unit-tests:
    # Task #2428 — Full `npm test` (vitest) suite on every PR/main push, so
    # server + shared + client unit tests gate merges (the existing `build`
    # job only runs the estimate-component slice). Mirrors the `e2e` job's
    # postgres service because vitest's `server/__tests__/globalSetup.ts`
    # pushes the Drizzle schema before the suites run.
    name: Unit Tests (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_test
      SESSION_SECRET: ci-session-secret-do-not-use-in-prod
      JWT_SECRET: ci-jwt-secret-do-not-use-in-prod
      EMAIL_TRANSPORT: noop
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Task #2428 — Use `npm run test:coverage` (not bare `npm test`) so the
      # `coverage/` directory is always produced and the artifact uploaded
      # below is non-empty on both pass and fail. The script is just
      # `vitest run --coverage` (see package.json) so the same suite runs
      # as `npm test` — only the v8 reporter is added.
      - name: Run vitest suite (with coverage)
        run: npm run test:coverage

      # Always upload the coverage report so reviewers can open the HTML
      # from the run page on green builds too (trend visibility), and
      # triagers can read the v8 report on failures without re-running.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

      - name: Notify Slack on unit-test failure (main only)
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/notify-slack-on-failure
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          job-name: Unit Tests (vitest)

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: development
      ENABLE_DEV_SEED: "true"
      PORT: "5000"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_test
      SESSION_SECRET: ci-session-secret-do-not-use-in-prod
      JWT_SECRET: ci-jwt-secret-do-not-use-in-prod
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        # Task #2233 — The `chromium-touch` Playwright project (added in
        # Task #2222) reuses the bundled Chromium binary installed here
        # (only `hasTouch: true` differs from the desktop `chromium`
        # project), so no separate `playwright install` invocation is
        # required for it. Keep `chromium firefox webkit` listed so
        # adding a new engine to `playwright.config.ts` requires an
        # explicit edit here — same pattern the touch-project gate
        # below uses.
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Push database schema
        run: npm run db:push -- --force

      # Task #2233 — Fail fast (before booting the dev server and
      # provisioning postgres state) if the `chromium-touch` Playwright
      # project ever gets removed, renamed, or its `testMatch` glob
      # stops matching `takeoff-touch-gestures.spec.ts`. `playwright
      # test --list --project=chromium-touch <spec>` prints the
      # discovered tests for the touch project; if the project is
      # missing Playwright exits non-zero with `Project(s) "chromium-
      # touch" not found`, and if the spec stops matching the listed
      # output is empty, which we then assert on. Without this guard a
      # well-meaning refactor of `playwright.config.ts` could silently
      # drop the palm-rejection / stylus-long-press / two-finger-rotate
      # coverage and only the spec-author would notice.
      #
      # Task #2235 — This step is now paired with the generic "Verify
      # every Playwright project discovers at least one test" guard
      # below, which catches the same silent-skip risk for the desktop
      # `chromium`, `firefox`, and `webkit` projects (and any future
      # project added to `playwright.config.ts`). Both gates are kept:
      # this one additionally asserts the touch project is matching
      # the *specific* `takeoff-touch-gestures.spec.ts` file (the
      # generic gate would still pass if `testMatch` were retargeted
      # at a different spec, since the project would still report
      # >= 1 test).
      - name: Verify chromium-touch project is registered
        run: |
          set -euo pipefail
          listing="$(npx playwright test \
            --project=chromium-touch \
            --list \
            e2e/takeoff-touch-gestures.spec.ts)"
          echo "$listing"
          if ! echo "$listing" | grep -q "takeoff-touch-gestures.spec.ts"; then
            echo "::error::chromium-touch project did not list any tests in e2e/takeoff-touch-gestures.spec.ts — check playwright.config.ts" >&2
            exit 1
          fi

      # Task #2235 — Generic version of the chromium-touch gate above:
      # run `npx playwright test --list --reporter=json` once and assert
      # that *every* project declared in `playwright.config.ts`
      # (currently `chromium`, `firefox`, `webkit`, `chromium-touch`)
      # discovers at least one test. Without this, a future edit that
      # left e.g. `chromium` with an empty `testMatch`/`testIgnore`
      # overlap (or moved every spec into a tag the project excludes)
      # would let CI stay green while silently shipping zero desktop
      # Chromium coverage. The script also writes a per-project
      # test-count table to `$GITHUB_STEP_SUMMARY` so reviewers can see
      # at a glance how the load is split across engines/projects on
      # every `e2e` run. Read `scripts/verify-playwright-projects-non-empty.mjs`
      # for the full rationale.
      - name: Verify every Playwright project discovers at least one test
        run: node scripts/verify-playwright-projects-non-empty.mjs

      # Task #2233 — Run every Playwright project explicitly so the CI
      # gate documents — at the call site — exactly which engines block
      # merge: desktop Chromium / Firefox / WebKit *and* the touch-
      # emulated `chromium-touch` project (added in Task #2222) which
      # owns the only end-to-end coverage of palm rejection, stylus
      # long-press → snap HUD, and two-finger rotate. The previous
      # `npm run test:e2e` ran the same set implicitly (Playwright
      # defaults to "all projects" when no `--project` is passed), but
      # made it dangerously easy for a future change to silently drop
      # the touch project by adding a single `--project chromium`
      # flag — there would be no `chromium-touch` mention left in the
      # CI file to grep for. Adding a new engine to
      # `playwright.config.ts` now requires a matching edit here, which
      # is the trade-off we want.
      # Task #2428 — Invoke via the canonical `npm run test:e2e` script (=
      # `playwright test`) so the gate matches the developer-facing contract
      # in package.json + README. The explicit `--project` enumeration is
      # preserved (Task #2233 audit guard) by passing the flags through to
      # the script with `--`.
      - name: Run E2E tests (chromium, firefox, webkit, chromium-touch)
        run: |
          npm run test:e2e -- \
            --project=chromium \
            --project=firefox \
            --project=webkit \
            --project=chromium-touch

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14

      # Task #1909 — Same Slack alert pattern as the canvas-heavy job
      # (Task #1897), now factored into a composite. Points triagers at the
      # `playwright-report` artifact uploaded just above so they can open the
      # HTML report straight from the run page.
      #
      # Task #2261 — Also pass the per-project test-count snippet that the
      # `Verify every Playwright project discovers at least one test` step
      # (Task #2235) writes to `playwright-project-counts.txt` (the script
      # writes that file unconditionally — see
      # `scripts/verify-playwright-projects-non-empty.mjs`). When the file
      # exists and is non-empty the composite action appends it as an extra
      # Slack section, so on-call sees which project(s) discovered which
      # test counts — and the names of any project(s) with 0 tests — in
      # the alert itself, without having to open the run page first. When
      # the verify step never ran (e.g. `npm ci` failed before it) the
      # file is absent and the composite silently omits the extra section,
      # so the alert still fires and renders exactly as it did before
      # this change.
      - name: Notify Slack on E2E failure (main only)
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/notify-slack-on-failure
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          job-name: E2E Tests (Playwright)
          artifact-name: playwright-report
          extra-context-file: playwright-project-counts.txt

  e2e-canvas-firefox-webkit:
    # Task #1886 — Task #1867 refactored the canvas-heavy Konva specs to share
    # an engine-aware drag helper (`e2e/helpers/canvasDrag.ts`) so they no
    # longer drift between Chromium and the other engines. To prove the green
    # bar end-to-end on Firefox + WebKit (the Replit dev container can launch
    # Firefox locally but cannot launch WebKit because Nix only ships
    # libjpeg.so.62 instead of the .so.8 WebKit links against, plus other
    # missing libs), this job runs the six refactored specs on both engines
    # against a real Postgres + dev server. Ubuntu's standard
    # /usr/lib/x86_64-linux-gnu paths supply every lib WebKit needs, and
    # `playwright install --with-deps` adds anything else (libnss3, libxkbcommon,
    # libgbm, etc.) so the host-requirements validator passes.
    #
    # Task #1896 — Originally a single runner ran both engines sequentially
    # (`--project=firefox --project=webkit`) with `workers: 1` pinned in
    # `playwright.config.ts`, so ~60 tests/engine ran end-to-end on one box.
    # Now the work is sharded across a 2×2 matrix (one engine per job, two
    # Playwright `--shard`s per engine = 4 parallel runners), cutting
    # wall-clock time roughly in 4 without changing the engine-aware drag
    # helper. The helper only branches on `browserName` and holds no shared
    # state, so it remains correct under parallel shards on separate
    # runners.
    #
    # Task #1911 — Each shard now writes a Playwright blob report
    # (`blob-report/report-<engine>-<shard>-of-2.zip`, named via
    # `PLAYWRIGHT_BLOB_OUTPUT_NAME` so all four files coexist in one
    # download folder) instead of a per-shard HTML. The follow-on
    # `merge-canvas-reports` job below downloads every blob and runs
    # `npx playwright merge-reports --reporter html` to produce a single
    # browsable report — reviewers no longer have to open four separate
    # artifacts to see the full Firefox + WebKit picture, and the merged
    # HTML still attributes each test to its project (engine), with the
    # per-shard blob artifacts kept around so a CI run can be traced back
    # to the runner that produced it.
    name: E2E Canvas Specs (${{ matrix.project }} shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      # Don't cancel the other shards/engines when one fails — we want to
      # see every failing shard in a single PR run instead of guessing
      # whether the other engine would have passed.
      fail-fast: false
      matrix:
        project: [firefox, webkit]
        shard: [1, 2]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: development
      ENABLE_DEV_SEED: "true"
      PORT: "5000"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_test
      SESSION_SECRET: ci-session-secret-do-not-use-in-prod
      JWT_SECRET: ci-jwt-secret-do-not-use-in-prod
      CI: "true"
      # Match the local Replit layout the task description references so the
      # install + test invocations agree on where the engine binaries live.
      PLAYWRIGHT_BROWSERS_PATH: .cache/ms-playwright
      # Task #2262 — Single source of truth for the enumerated canvas
      # spec list, consumed by both the `Verify canvas shard discovers
      # tests` pre-step and the `Run canvas-heavy specs` step below.
      # Keeping this list in one job-level env var (rather than copy-
      # pasting the six paths into both step bodies) makes it
      # impossible for the verify-step's view of "what should be
      # covered" to drift from what the test command actually runs —
      # which is the whole point of the gate. Whitespace-separated so
      # both `node ... -- $CANVAS_SPECS` and `npx playwright test ...
      # $CANVAS_SPECS` can word-split it directly.
      CANVAS_SPECS: >-
        e2e/takeoff-markup-drawing.spec.ts
        e2e/plan-markup-group-drag.spec.ts
        e2e/plan-markup-marquee-select.spec.ts
        e2e/plan-pins.spec.ts
        e2e/takeoff-markup-history-wiring.spec.ts
        e2e/takeoff-markup-undo.spec.ts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright ${{ matrix.project }} with system deps
        # Each shard only needs its own engine binary, so install just
        # that one. Skips ~150MB of unused download/extract per runner
        # vs. installing both engines.
        run: npx playwright install --with-deps ${{ matrix.project }}

      - name: Push database schema
        run: npm run db:push -- --force

      # Task #2262 — Same silent-skip guard as Task #2235's
      # `verify-playwright-projects-non-empty.mjs` (which protects the
      # adjacent `e2e` job), scoped here to the canvas-shard matrix.
      # Without this gate two coverage-shrinking edits would slip past
      # CI: (1) renaming or moving any of the six enumerated spec files
      # below without updating the YAML list (the path argument would
      # match no specs), and (2) `--shard=N/2` distribution emptying a
      # shard for a given engine — Playwright's default "0 tests = OK"
      # behaviour would let the job report green with half the canvas
      # coverage gone. The script verifies each enumerated path exists
      # on disk, runs `playwright test --list --reporter=json
      # --project=<engine> --shard=N/M <specs>` to enumerate exactly
      # what this shard would execute, and fails with an actionable
      # `::error::` annotation if either count is zero. It also writes
      # a per-shard markdown table to `$GITHUB_STEP_SUMMARY` mirroring
      # the per-project summary the Task #2235 script emits, so a
      # reviewer can see at a glance how the six specs split across
      # the four (engine × shard) runners on every PR.
      #
      # CANVAS_SPECS is set as a job-level env var below so the verify
      # step and the run step share a single source of truth — drift
      # between the two would defeat the gate.
      - name: Verify canvas shard discovers tests (${{ matrix.project }} shard ${{ matrix.shard }}/2)
        # `--expected-enumerated-specs=6` pins the canvas spec list at
        # exactly six. Any future PR that quietly trims `CANVAS_SPECS`
        # (the more dangerous variant of the silent-skip bug — every
        # surviving path still exists on disk and each shard still has
        # >= 1 test, so without this assertion the gate would still
        # pass) must also bump this number, which is exactly the human
        # review signal we want. The same six specs are listed at the
        # top of `CANVAS_SPECS` (job-level `env`); change one, and the
        # other has to follow.
        run: |
          # shellcheck disable=SC2086 # word-splitting CANVAS_SPECS is intentional
          node scripts/verify-canvas-shard-non-empty.mjs \
            --project=${{ matrix.project }} \
            --shard=${{ matrix.shard }}/2 \
            --expected-enumerated-specs=6 \
            -- $CANVAS_SPECS

      - name: Run canvas-heavy specs (${{ matrix.project }} shard ${{ matrix.shard }}/2)
        # `--shard=N/2` deals the six enumerated spec files across two
        # runners per engine. Playwright shards at the test-file level by
        # default, so each shard owns ~3 of the six specs end-to-end (no
        # mid-spec splits that could trip up the engine-aware drag
        # helper). `workers: 1` stays pinned in `playwright.config.ts`,
        # so within a shard the tests still run serially against the
        # single dev server — the parallelism comes from running 4
        # GitHub-hosted runners side by side.
        #
        # Task #1910 — Firefox + WebKit canvas specs occasionally flake
        # for reasons unrelated to a real regression (Konva pointer
        # timing, browser-launch hiccups, transient races against the
        # postgres service container). With the Slack alert from
        # Task #1897 covering the overlapping takeoff specs on `main`,
        # every such flake would wake the team. `--retries=1` makes
        # Playwright re-run any failing spec once before marking the
        # job failed, so the action's `failure()` (and therefore any
        # downstream Slack notifier) only triggers on a real, repeatable
        # regression. Set explicitly here — rather than relying on the
        # global `retries: process.env.CI ? 1 : 0` in
        # `playwright.config.ts` — so the intent is visible at the job
        # that needs it and survives any future tightening of the
        # global default for other E2E jobs. Retries are surfaced as
        # "flaky" outcomes in the merged HTML report produced by the
        # `merge-canvas-reports` job below, which is how we'll spot a
        # flake trend over time even when the job itself stays green.
        #
        # Task #1911 — `--reporter=blob,list` overrides the `[list, html]`
        # array configured in `playwright.config.ts` for CI: `list` keeps
        # the streaming step log readable, and `blob` emits the
        # machine-readable bundle that `playwright merge-reports`
        # consumes downstream. `PLAYWRIGHT_BLOB_OUTPUT_NAME` (read by
        # `resolveOutputFile` in Playwright's blob reporter) gives each
        # shard a unique zip filename so all four bundles can coexist in
        # the merge job's download folder without overwriting each other
        # — Playwright's default `report-<shard>.zip` would otherwise
        # collide between firefox-shard-1 and webkit-shard-1. Playwright's
        # blob format records `--retries=1` flake outcomes, so the merged
        # HTML report still surfaces flaky tests as described above.
        env:
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.project }}-${{ matrix.shard }}-of-2.zip
        run: |
          # Task #2262 — `$CANVAS_SPECS` (defined at the job level above)
          # is the single source of truth for the enumerated spec list
          # shared with the `Verify canvas shard discovers tests`
          # pre-step. Word-splitting here is intentional so each space-
          # separated path becomes its own positional argument to
          # `playwright test`.
          # shellcheck disable=SC2086
          npx playwright test \
            --project=${{ matrix.project }} \
            --shard=${{ matrix.shard }}/2 \
            --retries=1 \
            --reporter=blob,list \
            $CANVAS_SPECS

      - name: Upload Playwright blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Per-shard, per-engine artifact name so all four blob bundles
          # coexist on the run page; the `merge-canvas-reports` job
          # downloads them all by the `blob-report-canvas-*` glob.
          name: blob-report-canvas-${{ matrix.project }}-shard-${{ matrix.shard }}-of-2
          path: blob-report/
          retention-days: 14

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-canvas-${{ matrix.project }}-shard-${{ matrix.shard }}-of-2
          path: test-results/
          retention-days: 14

  merge-canvas-reports:
    # Task #1911 — Task #1896 sharded the canvas-heavy Firefox + WebKit
    # Playwright suite across a 2×2 matrix (engine × shard) on
    # `e2e-canvas-firefox-webkit`, which made failures findable but
    # forced reviewers to open up to four separate per-shard HTML
    # artifacts to see the full picture. The matrix shards now publish
    # blob reports (see the `Upload Playwright blob report` step above);
    # this job downloads every `blob-report-canvas-*` artifact, runs
    # `npx playwright merge-reports --reporter html` to stitch them
    # back together, and uploads a single `playwright-report-canvas`
    # HTML artifact. Each test in the merged report is still attributed
    # to its Playwright project (firefox or webkit), and the per-shard
    # blob artifacts are kept around so a failure can still be traced
    # back to the exact runner that produced it.
    name: Merge Canvas Test Reports
    # `if: always()` + `needs: [...]` ensures the merged report is
    # produced even when one or more shards fail — that's precisely the
    # case where reviewers most need a single combined view.
    if: always()
    needs: [e2e-canvas-firefox-webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # `npm ci` is required so the same Playwright version that
        # produced the blob bundles is available to merge them; the
        # blob format is versioned per Playwright release.
        run: npm ci

      - name: Download per-shard blob reports
        uses: actions/download-artifact@v4
        with:
          # Glob-match every per-shard upload from the matrix above and
          # flatten them into one folder so `merge-reports` sees all
          # four `report-<engine>-<shard>-of-2.zip` files at once. The
          # unique `PLAYWRIGHT_BLOB_OUTPUT_NAME` filenames set on each
          # shard prevent collisions during the flatten.
          path: all-blob-reports
          pattern: blob-report-canvas-*
          merge-multiple: true

      - name: Merge blob reports into a single HTML report
        # `merge-reports` reads every `*.zip` blob in the input folder
        # and produces a fresh `playwright-report/` HTML directory in
        # the working directory (matching what the `html` reporter
        # would have written for a single non-sharded run).
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload combined Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-canvas
          path: playwright-report/
          retention-days: 14

  e2e-webkit-takeoff:
    # Task #1889 — Dedicated Safari-only gate for the takeoff history wiring,
    # so a WebKit regression in those two specs blocks merge as its own
    # required check (alongside the broader `e2e-canvas-firefox-webkit` job
    # added in Task #1886, which runs the same two specs as part of a wider
    # Firefox+WebKit canvas suite).
    name: E2E WebKit (Takeoff)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: development
      ENABLE_DEV_SEED: "true"
      PORT: "5000"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_test
      SESSION_SECRET: ci-session-secret-do-not-use-in-prod
      JWT_SECRET: ci-jwt-secret-do-not-use-in-prod
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright WebKit browser
        run: npx playwright install --with-deps webkit

      - name: Push database schema
        run: npm run db:push -- --force

      - name: Run takeoff specs against WebKit
        run: npx playwright test --project=webkit e2e/takeoff-markup-undo.spec.ts e2e/takeoff-markup-history-wiring.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-webkit-takeoff
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-webkit-takeoff
          path: test-results/
          retention-days: 14

      # Task #1897 — Engine-specific Konva regressions on Firefox + WebKit
      # only surface in this job, so a failure on `main` would otherwise sit
      # silently in the Actions tab until somebody happened to look. Post a
      # Slack alert pointing at the failed run and the uploaded Playwright
      # report artifact so the team can triage immediately.
      #
      # Task #1909 — the same pattern is now used by every other gate that
      # blocks `main` (`build`, `e2e`, `cloud-import-security`,
      # `sage-sync-tests`, `lint`, `security`), so the heredoc + webhook-
      # missing fallback have been factored into the composite action at
      # `.github/actions/notify-slack-on-failure/`. Read its `action.yml` for
      # the scoping rules (only fires on `failure()` for `push` events on
      # `refs/heads/main`, no-ops with a `notice` when the secret is unset).
      - name: Notify Slack on E2E WebKit (Takeoff) failure (main only)
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/notify-slack-on-failure
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          job-name: E2E WebKit (Takeoff)
          artifact-name: playwright-report-webkit-takeoff

  cloud-import-security:
    # Task #1507 — Run the cloud-import SSRF + size guard suites on every PR
    # so a regression to `safeDownload` or the `POST /api/documents/from-cloud`
    # handler can't ship unnoticed. The handler-level test
    # (`from-cloud-ssrf-redirect.test.ts`) exercises the real Express app and
    # therefore needs a live Postgres for the seeded org/user/project rows;
    # `safe-download.test.ts` is purely unit-level but runs in the same job
    # so a single failure surface blocks merge for either suite.
    name: Cloud Import Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_test
      SESSION_SECRET: ci-session-secret-do-not-use-in-prod
      JWT_SECRET: ci-jwt-secret-do-not-use-in-prod
      PRIVATE_OBJECT_DIR: /test-bucket/private
      PUBLIC_OBJECT_SEARCH_PATHS: /test-bucket/public
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run cloud-import security tests (safeDownload + from-cloud SSRF)
        run: npx vitest run server/__tests__/safe-download.test.ts server/__tests__/from-cloud-ssrf-redirect.test.ts

      # Task #1909 — A regression in `safeDownload` or the from-cloud SSRF
      # handler is a security-sensitive failure; alert the team immediately
      # when it lands on `main` instead of waiting for a manual Actions check.
      # No artifact is uploaded by this job, so `artifact-name` is omitted and
      # the message points triagers at the run page log.
      - name: Notify Slack on cloud-import security failure (main only)
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/notify-slack-on-failure
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          job-name: Cloud Import Security Tests

  sage-sync-tests:
    # Task #1605 — Run the Sage Intacct sync vitest suite on every PR so the
    # XML envelope structure (the only place pinning down the wire format
    # we send to Sage) and the `exportInvoice` idempotency contract can't
    # regress unnoticed. The unit-level suite (`sage-sync.test.ts`,
    # added in Task #1600) covers envelope build / response parse /
    # credential resolution / feature-flag gate; the DB-backed
    # `sage-export-invoice-idempotency.test.ts` exercises the round-trip
    # against `integration_sync_state` with only the network layer stubbed
    # (via the `fetchImpl` injection seam on exportInvoice), so a bug that
    # re-pushes the same invoice every run (double-billing customers) fails
    # the build instead of shipping. The DB-backed file needs a real
    # Postgres for the seeded org/connection rows, so this job provisions
    # its own postgres service.
    name: Sage Sync Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_test
      SESSION_SECRET: ci-session-secret-do-not-use-in-prod
      JWT_SECRET: ci-jwt-secret-do-not-use-in-prod
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Sage sync vitest suite
        run: npx vitest run server/__tests__/sage-sync.test.ts server/__tests__/sage-export-invoice-idempotency.test.ts

      # Task #1909 — A Sage envelope/idempotency regression on `main` would
      # silently risk double-billing customers, so surface the failure in
      # Slack the moment it lands. No artifact is uploaded by this job.
      - name: Notify Slack on Sage sync failure (main only)
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/notify-slack-on-failure
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          job-name: Sage Sync Tests

  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # TODO: Enable when ESLint is configured
      # - name: Run ESLint
      #   run: npm run lint

      # Task #1375 — guard against the production-crashing regression where an
      # Express handler calls `next(error)` without declaring `next` in its
      # signature. `scripts/audit-next-without-param.mjs` scans server/ for that
      # pattern and exits non-zero (printing the offending file/line) when any
      # handler is missing the `next` parameter, blocking the merge.
      - name: Audit Express handlers for missing `next` parameter
        run: node scripts/audit-next-without-param.mjs

      # Task #1492 — guard against the audit-trail regression where a route
      # calls e.g. `logCreate(req, ...)` instead of
      # `logCreate(req.user!.id, ..., req)`. The audit helpers swallow errors
      # in a try/catch, so the bad call shape (originally fixed in Task #1454
      # for server/projectOpsRoutes.ts) silently drops audit rows.
      # `scripts/audit-audit-logger-userid.mjs` scans server/ for any
      # log{Audit,Create,Update,Delete,Approve,Reject} call whose userId
      # argument looks like an Express Request, and fails the build on a hit.
      - name: Audit calls to auditLogger for misplaced request arguments
        run: node scripts/audit-audit-logger-userid.mjs

      # Task #1909 — A regression in the Express-handler `next` audit or the
      # auditLogger argument audit would land silently on `main` today; the
      # Slack alert closes that gap. No artifact is uploaded by this job, so
      # the message points triagers at the run page log directly.
      - name: Notify Slack on lint failure (main only)
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/notify-slack-on-failure
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          job-name: Code Quality

  security:
    name: Security Gate (SOC 2 CC8.1 / CC7.1)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Python (for semgrep & checkov)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install security scanners
        run: |
          python -m pip install --upgrade pip
          pip install semgrep checkov
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
          semgrep --version
          checkov --version

      - name: Run CI security gate
        id: security_gate
        run: |
          set +e
          mkdir -p security-reports
          bash scripts/ci-security.sh 2>&1 | tee security-reports/ci-security.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Publish job summary
        if: always()
        run: |
          {
            echo "# Security Gate Results"
            echo ""
            echo "SOC 2 controls: **CC8.1** (change management) and **CC7.1** (vulnerability management)."
            echo ""
            echo "Script: \`scripts/ci-security.sh\` — dependency audit, SAST (semgrep), secret scan (gitleaks), IaC scan (checkov), license audit (license-checker-rseidelsohn)."
            echo ""
            if [ "${{ steps.security_gate.outputs.exit_code }}" = "0" ]; then
              echo "**Status:** PASSED — no Critical/High findings."
            else
              echo "**Status:** FAILED (exit code ${{ steps.security_gate.outputs.exit_code }}) — merge is blocked until findings are remediated."
            fi
            echo ""
            echo "<details><summary>Full scanner output</summary>"
            echo ""
            echo '```'
            # Strip ANSI color codes for readability in the summary.
            sed 's/\x1b\[[0-9;]*m//g' security-reports/ci-security.log | tail -c 60000
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload security report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-security-report
          path: security-reports/
          retention-days: 90

      - name: Comment on PR with security gate result
        # Best-effort: forked PRs may not grant pull-requests:write, and we
        # don't want a comment-posting failure to mask the real gate result.
        # The job summary + uploaded artifact remain the canonical evidence.
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const exitCode = '${{ steps.security_gate.outputs.exit_code }}';
            const passed = exitCode === '0';
            let log = '';
            try {
              log = fs.readFileSync('security-reports/ci-security.log', 'utf8')
                // strip ANSI colors
                .replace(/\x1b\[[0-9;]*m/g, '');
            } catch (e) {
              log = '(no log captured)';
            }
            // Trim to last ~12k chars to stay under GitHub's 65k comment limit.
            const trimmed = log.length > 12000 ? '…(truncated)…\n' + log.slice(-12000) : log;
            const status = passed
              ? '✅ **PASSED** — no Critical/High findings.'
              : `❌ **FAILED** (exit code ${exitCode}) — merge is blocked until Critical/High findings are remediated.`;
            const marker = '<!-- ci-security-gate-comment -->';
            const body = [
              marker,
              '## Security Gate (SOC 2 CC8.1 / CC7.1)',
              '',
              status,
              '',
              'Script: `scripts/ci-security.sh` — dependency audit, SAST, secret scan, IaC scan, license audit.',
              '',
              '<details><summary>Scanner output</summary>',
              '',
              '```',
              trimmed,
              '```',
              '',
              '</details>',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }

      # Task #1909 — A Critical/High security finding that lands on `main`
      # blocks merges going forward, so the team needs to know immediately.
      # Points triagers at the `ci-security-report` artifact uploaded above
      # so they can open the full scanner output without re-running anything.
      - name: Notify Slack on security gate failure (main only)
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/notify-slack-on-failure
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          job-name: Security Gate (SOC 2 CC8.1 / CC7.1)
          artifact-name: ci-security-report
