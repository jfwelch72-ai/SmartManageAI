name: Notify Slack on CI failure
description: >
  Post a Slack alert pointing at the failed run (and, when supplied, naming the
  uploaded artifact that holds the diagnostic output). If the
  `SLACK_WEBHOOK_URL` secret has not been wired up in the repo (e.g. forks, or
  before a maintainer has configured it), the action logs a notice and exits
  cleanly instead of failing the job a second time on top of the test failure
  we are already alerting about.

  This composite is the single home for the Slack-on-failure logic that used to
  live inline at the bottom of `e2e-webkit-takeoff` (added in Task #1897). Task
  #1909 extended the same alert to the other gates that block `main` (`build`,
  `e2e`, `cloud-import-security`, `sage-sync-tests`, `lint`, `security`), and
  factoring it into a composite keeps the heredoc and the webhook-missing
  fallback in one place instead of six.

  The `failure() && github.event_name == 'push' && github.ref ==
  'refs/heads/main'` gate stays at the calling site so we can also skip the
  step entirely (and the noisy `notice` line) on PR builds and forks.

inputs:
  webhook-url:
    description: >
      Slack incoming webhook URL. Pass in `${{ secrets.SLACK_WEBHOOK_URL }}`.
      Empty / missing = log a notice and skip the post (no failure).
    required: false
    default: ''
  job-name:
    description: >
      Human-readable job name to surface in the Slack message (e.g.
      "Build & Test", "E2E Tests (Playwright)"). This is what a triager sees
      in the alert headline so make it match the GitHub Actions job name.
    required: true
  artifact-name:
    description: >
      Name of the artifact uploaded by this job that holds the failure
      diagnostics (Playwright report, security report, etc.). Omit for jobs
      that do not upload an artifact (e.g. `lint`); the message will then
      point at the run page only.
    required: false
    default: ''
  extra-context:
    description: >
      Optional Slack mrkdwn snippet to append as an additional section in the
      message body (e.g. per-project test counts written by
      `scripts/verify-playwright-projects-non-empty.mjs`). Use this when the
      caller already has the snippet in a workflow expression; for snippets
      written to disk by an earlier step in the same job, prefer
      `extra-context-file` so multi-line content doesn't have to be inlined
      into a `with:` block. When both are supplied, `extra-context-file`
      wins if its file exists and is non-empty.
    required: false
    default: ''
  extra-context-file:
    description: >
      Optional path to a file whose contents should be appended as the Slack
      mrkdwn snippet described above. When the file exists and is non-empty
      its contents win over `extra-context`; when it is missing or empty,
      this input is silently ignored — that lets a caller wire the file in
      unconditionally without having to gate on whether the producer step
      ran. Task #2261 uses this to surface the per-project Playwright test
      counts (and the names of any zero-test projects) in the e2e Slack
      alert without making on-call open the run page first.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Post Slack alert
      shell: bash
      env:
        SLACK_WEBHOOK_URL: ${{ inputs.webhook-url }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        JOB: ${{ inputs.job-name }}
        EXTRA_CONTEXT: ${{ inputs.extra-context }}
        EXTRA_CONTEXT_FILE: ${{ inputs.extra-context-file }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        REPO: ${{ github.repository }}
        COMMIT_SHA: ${{ github.sha }}
        COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        ACTOR: ${{ github.actor }}
        WORKFLOW: ${{ github.workflow }}
      run: |
        set -euo pipefail
        if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
          echo "::notice::SLACK_WEBHOOK_URL is not set; skipping Slack alert for '${JOB}'. Add it under Settings → Secrets and variables → Actions to enable failure alerts on main."
          exit 0
        fi

        short_sha="${COMMIT_SHA:0:7}"

        # Artifact line is optional — jobs like `lint` don't upload anything,
        # so the message should just point at the run page in that case.
        if [ -n "${ARTIFACT_NAME:-}" ]; then
          artifact_text="<${RUN_URL}|Open the failed run> — diagnostics are attached as the *${ARTIFACT_NAME}* artifact at the bottom of that page."
        else
          artifact_text="<${RUN_URL}|Open the failed run> — see the job log for details (no artifact is uploaded by this gate)."
        fi

        # Resolve the optional extra-context block. A file-based input wins
        # over the inline string so callers can hand off arbitrary multi-line
        # snippets (e.g. the per-project Playwright counts from Task #2261)
        # without having to inline them into a `with:` block. Both inputs
        # are optional; when neither is supplied (or when the file is
        # missing/empty), the message renders exactly as it did before
        # Task #2261 introduced this support.
        extra=""
        if [ -n "${EXTRA_CONTEXT_FILE:-}" ] && [ -s "${EXTRA_CONTEXT_FILE}" ]; then
          extra="$(cat "${EXTRA_CONTEXT_FILE}")"
        elif [ -n "${EXTRA_CONTEXT:-}" ]; then
          extra="${EXTRA_CONTEXT}"
        fi

        # Slack section text limit is 3000 characters; truncate defensively
        # so an unexpectedly large snippet (e.g. a future producer that
        # forgets its own cap) doesn't 400 the webhook and swallow the
        # alert. The producer scripts cap at 2800 too — this is a second
        # belt-and-braces guard at the consumer side.
        if [ "${#extra}" -gt 2800 ]; then
          extra="${extra:0:2800}…(truncated)"
        fi

        # Build the JSON payload with `jq` so every interpolated value is
        # safely escaped. The previous heredoc-based construction would
        # break if any input — job name, artifact name, or extra context —
        # contained quotes, newlines, or backslashes (none of the existing
        # callers happened to, but the new `extra-context` input from
        # Task #2261 explicitly carries multi-line markdown). `jq` is
        # preinstalled on `ubuntu-latest` runners.
        payload=$(jq -n \
          --arg short_sha "${short_sha}" \
          --arg job "${JOB}" \
          --arg repo "${REPO}" \
          --arg commit_url "${COMMIT_URL}" \
          --arg actor "${ACTOR}" \
          --arg workflow "${WORKFLOW}" \
          --arg artifact_text "${artifact_text}" \
          --arg extra "${extra}" \
          '
          {
            text: ":rotating_light: \($job) failed on main — \($short_sha)",
            blocks: (
              [
                {
                  type: "header",
                  text: { type: "plain_text", text: ":rotating_light: \($job) failed on main" }
                },
                {
                  type: "section",
                  fields: [
                    { type: "mrkdwn", text: "*Repo*\n\($repo)" },
                    { type: "mrkdwn", text: "*Job*\n\($job)" },
                    { type: "mrkdwn", text: "*Commit*\n<\($commit_url)|\($short_sha)> by \($actor)" },
                    { type: "mrkdwn", text: "*Workflow*\n\($workflow)" }
                  ]
                },
                {
                  type: "section",
                  text: { type: "mrkdwn", text: $artifact_text }
                }
              ]
              + ( if ($extra | length) > 0
                  then [ { type: "section", text: { type: "mrkdwn", text: $extra } } ]
                  else []
                end )
            )
          }
          ')

        # `--fail-with-body` so a non-2xx from Slack still surfaces the
        # response body in the job log, and the step exits non-zero — that
        # way a misconfigured webhook is visible instead of silently
        # swallowed. The test failure itself is already reflected by the
        # earlier failed step.
        curl --silent --show-error --fail-with-body \
          -X POST \
          -H 'Content-Type: application/json' \
          --data "${payload}" \
          "${SLACK_WEBHOOK_URL}"
